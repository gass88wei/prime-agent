name: Build Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '版本号（不带 v，留空则用 package.json 的 version）'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build packages
        run: npm run build
      - name: Check (lint / type / installer / browser smoke)
        run: npm run check
      - name: Resolve release version
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            V="${{ github.event.inputs.release_tag }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          case "$V" in v*) V="${V#v}";; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - name: Pack release tarballs
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download
        run: |
          npm run release:pack -- \
            --channel stable \
            --version "$RELEASE_VERSION" \
            --base-url "$RELEASE_BASE_URL" \
            --out-dir packages/coding-agent/release
      - name: Upload tarball artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: packages/coding-agent/release/artifacts/*
          if-no-files-found: error

  binaries-unix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin-arm64, darwin-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build standalone binary
        run: ./scripts/build-binaries.sh --platform ${{ matrix.platform }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.platform }}
          path: packages/coding-agent/binaries/pi-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  binaries-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (bun install generates native addon manifest)
        shell: bash
        run: bun install --frozen-lockfile
      - name: Build packages
        shell: bash
        run: npm run build
      - name: Build Windows binary (zeromq embedded)
        shell: bash
        run: |
          cd packages/coding-agent
          mkdir -p binaries/windows-x64
          bun build --compile --external koffi --target=bun-windows-x64 ./dist/bun/cli.js --outfile binaries/windows-x64/pi.exe
      - name: Assemble release folder
        shell: bash
        run: |
          cd packages/coding-agent
          mkdir -p binaries/windows-x64
          cp package.json README.md CHANGELOG.md binaries/windows-x64/
          cp ../../node_modules/@silvia-odwyer/photon-node/photon_rs_bg.wasm binaries/windows-x64/
          mkdir -p binaries/windows-x64/theme binaries/windows-x64/assets
          cp dist/modes/interactive/theme/*.json binaries/windows-x64/theme/
          cp dist/modes/interactive/assets/* binaries/windows-x64/assets/
          cp -r dist/core/export-html binaries/windows-x64/
          cp -r docs binaries/windows-x64/
          cp -r examples binaries/windows-x64/
          cp -r skills binaries/windows-x64/
      - name: Package zip
        shell: pwsh
        run: |
          cd packages/coding-agent/binaries
          Compress-Archive -Path windows-x64 -DestinationPath pi-windows-x64.zip -Force
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-windows-x64
          path: packages/coding-agent/binaries/pi-windows-x64.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build, binaries-unix, binaries-windows]
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download tarball artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: dist/tarballs
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          merge-multiple: true
          path: dist/binaries
      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp dist/tarballs/* dist/assets/ || true
          cp dist/binaries/* dist/assets/ || true
          ls -lh dist/assets
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "==> Updating existing release ${TAG}"
            gh release upload "${TAG}" dist/assets/* --clobber
          else
            echo "==> Creating release ${TAG}"
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes \
              --target "${GITHUB_SHA}" \
              dist/assets/*
          fi
      - name: Print download summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${TAG}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | sed 's/^/  - /' | head -40